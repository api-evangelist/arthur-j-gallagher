naftiko: 1.0.0-alpha2
info:
  label: Gallagher Command Centre REST API
  description: The Gallagher Command Centre REST API provides HTTP functions for querying the Command Centre database and
    integrating third-party systems with Gallagher's security platform. Supports access control, alarm monitoring, cardholder
    management, and site management operations.
  tags:
  - Arthur
  - J
  - Gallagher
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: arthur-j-gallagher
    baseUri: https://localhost:8904/api
    description: Gallagher Command Centre REST API HTTP API.
    resources:
    - name: cardholders
      path: /cardholders
      operations:
      - name: listcardholders
        method: GET
        description: List Cardholders
        inputParameters:
        - name: top
          in: query
          type: integer
          description: Maximum number of results to return.
        - name: name
          in: query
          type: string
          description: Filter by cardholder name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: alarms
      path: /alarms
      operations:
      - name: listalarms
        method: GET
        description: List Alarms
        inputParameters:
        - name: top
          in: query
          type: integer
          description: Maximum number of results to return.
        - name: source
          in: query
          type: string
          description: Filter by alarm source.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: access-groups
      path: /access_groups
      operations:
      - name: listaccessgroups
        method: GET
        description: List Access Groups
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: events
      path: /events
      operations:
      - name: listevents
        method: GET
        description: List Events
        inputParameters:
        - name: after
          in: query
          type: string
          description: Return events after this event ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: arthur-j-gallagher-rest
    description: REST adapter for Gallagher Command Centre REST API.
    resources:
    - path: /cardholders
      name: listcardholders
      operations:
      - method: GET
        name: listcardholders
        description: List Cardholders
        call: arthur-j-gallagher.listcardholders
        outputParameters:
        - type: object
          mapping: $.
    - path: /alarms
      name: listalarms
      operations:
      - method: GET
        name: listalarms
        description: List Alarms
        call: arthur-j-gallagher.listalarms
        outputParameters:
        - type: object
          mapping: $.
    - path: /access_groups
      name: listaccessgroups
      operations:
      - method: GET
        name: listaccessgroups
        description: List Access Groups
        call: arthur-j-gallagher.listaccessgroups
        outputParameters:
        - type: object
          mapping: $.
    - path: /events
      name: listevents
      operations:
      - method: GET
        name: listevents
        description: List Events
        call: arthur-j-gallagher.listevents
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: arthur-j-gallagher-mcp
    transport: http
    description: MCP adapter for Gallagher Command Centre REST API for AI agent use.
    tools:
    - name: listcardholders
      description: List Cardholders
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: arthur-j-gallagher.listcardholders
      with:
        top: tools.top
        name: tools.name
      inputParameters:
      - name: top
        type: integer
        description: Maximum number of results to return.
      - name: name
        type: string
        description: Filter by cardholder name.
      outputParameters:
      - type: object
        mapping: $.
    - name: listalarms
      description: List Alarms
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: arthur-j-gallagher.listalarms
      with:
        top: tools.top
        source: tools.source
      inputParameters:
      - name: top
        type: integer
        description: Maximum number of results to return.
      - name: source
        type: string
        description: Filter by alarm source.
      outputParameters:
      - type: object
        mapping: $.
    - name: listaccessgroups
      description: List Access Groups
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: arthur-j-gallagher.listaccessgroups
      outputParameters:
      - type: object
        mapping: $.
    - name: listevents
      description: List Events
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: arthur-j-gallagher.listevents
      with:
        after: tools.after
      inputParameters:
      - name: after
        type: string
        description: Return events after this event ID.
      outputParameters:
      - type: object
        mapping: $.
