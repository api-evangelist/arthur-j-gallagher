aid: arthur-j-gallagher
name: Arthur J. Gallagher
description: >-
  Arthur J. Gallagher & Co. is a global insurance brokerage, risk management, and consulting firm headquartered in
  Rolling Meadows, Illinois. The company provides insurance brokerage, risk management, employee benefits, and
  retirement services to clients worldwide. Its subsidiaries include Gallagher Security (which offers the Command Centre
  REST API for physical security integration) and Gallagher Bassett (which offers claims management APIs for third-party
  claims administration). Arthur J. Gallagher serves clients in over 130 countries through its international network of
  brokers and offices.
