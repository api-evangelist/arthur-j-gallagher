  - type: Features
    data:
      - name: Command Centre REST API
        description: >-
          Full REST API for integrating with Gallagher's Command Centre physical security system, enabling access
          control, alarm management, visitor tracking, and event monitoring from third-party applications.
      - name: Cloud API Gateway
        description: >-
          Internet-based secure connectivity to Command Centre servers, enabling remote integration without VPN through
          the Gallagher Cloud API Gateway.
      - name: Mobile Connect SDK
        description: >-
          SDK for developing mobile applications that connect to Gallagher Command Centre for access control, including
          code samples and technical guides.
      - name: Claims Management API
        description: >-
          Gallagher Bassett API for programmatic integration with third-party claims administration workflows including
          claim submission, status tracking, and reporting.
  - type: UseCases
    data:
      - name: Physical Security Integration
        description: >-
          Technology partners integrate Command Centre REST API to build visitor management systems, CCTV integrations,
          and security operations center dashboards.
      - name: Access Control Automation
        description: >-
          Corporate IT teams integrate access control with HR systems to automatically provision and deprovision
          employee badge access based on employment status changes.
      - name: Claims Processing Integration
        description: >-
          Enterprise clients integrate Gallagher Bassett's claims API with their ERP and HR systems to automate workers
          compensation and liability claims submission and tracking.
      - name: Incident Response
        description: >-
          Security operations teams use the Command Centre API to correlate access events with alarm triggers for
          automated incident response and reporting.
  - type: Integrations
    data:
      - name: Gallagher Security Technology Partner Program
        description: >-
          Formal partner program for companies integrating with Command Centre, providing access to proprietary
          technology resources, software licenses, and technical support.
      - name: Gallagher Bassett Claims Administration
        description: >-
          Third-party administrators and enterprise clients integrate with Gallagher Bassett for outsourced claims
          management workflows.
